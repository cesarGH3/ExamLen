<form method="post" action="{{destino}}" class="formulario formulario-opcion">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="accion" value="actualizarOpcion">
    <input type="hidden" name="idOpcion" value="{{idOpcion}}">
    <div class="campo">
        <label for="texto">Texto de la opción</label>
        <input id="texto" name="texto" type="text" required maxlength="500" value="{{texto}}">
    </div>
    <label class="casilla">
        <input type="checkbox" name="esCorrecta" value="true" {{marcada}}>
        Es la respuesta correcta
    </label>
    <div class="acciones">
        <button type="submit" class="boton boton-contorno">Guardar opción</button>
        <a class="boton boton-contorno" href="{{volver}}">Cancelar</a>
    </div>
</form>
