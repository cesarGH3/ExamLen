<form method="post" action="{{ctx}}/app/docente/intento" class="form-en-linea">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="idRespuesta" value="{{idRespuesta}}">
    <input type="number" name="puntaje" step="0.5" min="0" max="{{maximo}}" required
           value="{{puntajeValor}}" class="entrada-puntaje" aria-label="Puntaje de la respuesta">
    <input type="text" name="comentario" maxlength="1000" placeholder="Comentario (opcional)"
           value="{{comentarioValor}}" class="entrada-comentario" aria-label="Comentario (opcional)">
    <button type="submit" class="boton boton-pequeno">{{textoBoton}}</button>
</form>
