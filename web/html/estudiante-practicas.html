<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tabla.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/insignia.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/estudiante-practicas.css">
</head>
<body>
{{{nav}}}
<main class="contenido">
    {{{mensajes}}}
    <h1>Práctica</h1>
    <p class="ayuda">Práctica libre: intentos ilimitados y corrección inmediata con retroalimentación.</p>
    <p class="acciones">
        <a class="boton boton-contorno" href="{{historial}}">Ver mi historial de práctica</a>
    </p>
    <form method="get" action="{{ctx}}/app/estudiante/practica" class="formulario formulario-fila">
        <div class="campo">
            <label for="nivel">Filtrar por nivel</label>
            <select id="nivel" name="nivel">{{{opcionesNivel}}}</select>
        </div>
        <div class="acciones">
            <button type="submit" class="boton boton-contorno">Filtrar</button>
            {{{limpiarFiltro}}}
        </div>
    </form>
    <section class="hoja">
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col">Material</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Nivel</th>
                    <th scope="col">Preguntas</th>
                    <th scope="col"><span class="oculto">Acción</span></th>
                </tr>
                </thead>
                <tbody>{{{filas}}}</tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
