<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docentes | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tabla.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/insignia.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/admin-docentes.css">
</head>
<body>
{{{nav}}}
<main class="contenido">
    {{{mensajes}}}
    <h1>Docentes</h1>


    <section class="hoja">
        <h2>Registrar docente</h2>
        <p class="ayuda">ExamLen genera una contraseña temporal. El docente deberá cambiarla la primera vez que ingrese.</p>
        <form method="post" action="{{ctx}}/app/admin/docentes" class="formulario formulario-fila">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <div class="campo">
                <label for="identificacion">Identificación</label>
                <input id="identificacion" name="identificacion" type="text" required
                       minlength="5" maxlength="20" pattern="[A-Za-z0-9]{5,20}"
                       title="Entre 5 y 20 letras o números, sin espacios"
                       autocomplete="off" value="{{identificacion}}">
            </div>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" required
                       minlength="2" maxlength="100" pattern="[\p{L}][\p{L} '\-]{1,99}"
                       title="Solo letras, espacios, apóstrofos o guiones"
                       autocomplete="off" value="{{nombre}}">
            </div>
            <div class="campo">
                <label for="correo">Correo</label>
                <input id="correo" name="correo" type="email" required maxlength="254"
                       autocomplete="off" value="{{correo}}">
            </div>
            <div class="campo">
                <label for="institucion">Institución (opcional)</label>
                <input id="institucion" name="institucion" type="text" maxlength="150"
                       autocomplete="organization" value="{{institucion}}">
            </div>
            <div class="acciones">
                <button type="submit" class="boton">Registrar docente</button>
            </div>
        </form>
    </section>

    <section class="hoja">
        <h2>Docentes registrados</h2>
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col">Identificación</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Correo</th>
                    <th scope="col">Estado</th>
                    <th scope="col"><span class="oculto">Acción</span></th>
                </tr>
                </thead>
                <tbody>
                {{{filas}}}
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
