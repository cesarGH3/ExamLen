<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis cursos | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tabla.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/insignia.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/docente-cursos.css">
</head>
<body>
{{{nav}}}
<main class="contenido">
    {{{mensajes}}}
    <h1>Mis cursos</h1>
    <div class="disposicion">
        <section class="hoja">
            <h2>Cursos</h2>
            <div class="tabla-contenedor">
                <table class="tabla">
                    <thead>
                    <tr><th scope="col">Curso</th><th scope="col">Nivel</th><th scope="col">Estado</th></tr>
                    </thead>
                    <tbody>{{{filas}}}</tbody>
                </table>
            </div>
        </section>

        <section class="hoja">
            <h2>Crear curso</h2>
            <p class="ayuda">Un curso se crea una sola vez. Cada periodo abres un grupo nuevo dentro de él.</p>
            <form method="post" action="{{ctx}}/app/docente/cursos" class="formulario">
                <input type="hidden" name="_csrf" value="{{csrf}}">
                <div class="campo">
                    <label for="nombre">Nombre del curso</label>
                    <input id="nombre" name="nombre" type="text" required minlength="3" maxlength="100" value="{{nombre}}">
                </div>
                <div class="campo">
                    <label for="nivel">Nivel</label>
                    <select id="nivel" name="nivel" required>{{{opcionesNivel}}}</select>
                </div>
                <div class="campo">
                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" name="descripcion" maxlength="500" rows="3">{{descripcion}}</textarea>
                </div>
                <button type="submit" class="boton">Crear curso</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
