<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar inscripción | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/estudiante-grupos.css">
</head>
<body>
{{{nav}}}
<main class="contenido contenido-estrecho">
    {{{mensajes}}}
    <h1>Confirmar inscripción</h1>
    <section class="hoja">
        <p>Estás a punto de inscribirte en este grupo. Revisa los datos antes de confirmar:</p>
        <ul>
            <li><strong>Curso:</strong> {{curso}} ({{nivel}})</li>
            <li><strong>Grupo:</strong> {{grupo}} · Periodo {{periodo}}</li>
            <li><strong>Docente:</strong> {{docente}}</li>
        </ul>
        <form method="post" action="{{ctx}}/app/estudiante/grupos" class="formulario">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <input type="hidden" name="accion" value="confirmarUnirse">
            <input type="hidden" name="codigo" value="{{codigo}}">
            <input type="hidden" name="confirmado" value="1">
            <div class="acciones">
                <button type="submit" class="boton">Confirmar inscripción</button>
                <a class="boton boton-contorno" href="{{ctx}}/app/estudiante/grupos">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
