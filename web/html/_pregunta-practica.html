<article class="pregunta-examen">
    <h3>{{numero}}. {{enunciado}}</h3>
    {{{feedback}}}
    <form method="post" action="{{ctx}}/app/estudiante/practica" class="formulario">
        <input type="hidden" name="_csrf" value="{{csrf}}">
        <input type="hidden" name="idIntento" value="{{idIntento}}">
        <input type="hidden" name="idPregunta" value="{{idPregunta}}">
        <input type="hidden" name="accion" value="responder">
        {{{bloqueRespuesta}}}
        <div class="acciones">
            <button type="submit" class="boton boton-contorno boton-pequeno">Responder</button>
        </div>
    </form>
</article>
