<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Material de práctica | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tabla.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/insignia.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/docente-practicas.css">
</head>
<body>
{{{nav}}}
<main class="contenido">
    {{{mensajes}}}
    <h1>Material de práctica</h1>

    <section class="hoja">
        <h2>Crear material</h2>
        <p class="ayuda">Después de crearlo podrás agregar preguntas aprobadas, ofrecerlo a tus cursos y publicarlo.</p>
        <form method="post" action="{{ctx}}/app/docente/practica" class="formulario formulario-fila">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <input type="hidden" name="accion" value="crear">
            <div class="campo">
                <label for="titulo">Título</label>
                <input id="titulo" name="titulo" type="text" required minlength="3" maxlength="150"
                       autocomplete="off">
            </div>
            <div class="campo">
                <label for="descripcion">Descripción (opcional)</label>
                <input id="descripcion" name="descripcion" type="text" maxlength="500" autocomplete="off">
            </div>
            <div class="campo">
                <label for="nivel">Nivel</label>
                <select id="nivel" name="nivel" required>{{{opcionesNivel}}}</select>
            </div>
            <div class="acciones">
                <button type="submit" class="boton">Crear material</button>
            </div>
        </form>
    </section>

    <section class="hoja">
        <h2>Materiales</h2>
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col">Material</th>
                    <th scope="col">Preguntas</th>
                    <th scope="col">Intentos</th>
                    <th scope="col">Estado</th>
                    <th scope="col"><span class="oculto">Acción</span></th>
                </tr>
                </thead>
                <tbody>{{{filas}}}</tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
