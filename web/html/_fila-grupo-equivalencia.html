<tr>
    <td>{{nivelTexto}} · {{competenciaTexto}} · {{dificultadTexto}}</td>
    <td class="texto-largo">{{{preguntas}}}</td>
    <td class="celda-accion">
        <form method="post" action="{{ctx}}/app/docente/evaluacion" class="form-en-linea">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <input type="hidden" name="id" value="{{id}}">
            <input type="hidden" name="accion" value="subirGrupo">
            <input type="hidden" name="nivel" value="{{nivel}}">
            <input type="hidden" name="competencia" value="{{competencia}}">
            <input type="hidden" name="dificultad" value="{{dificultad}}">
            <button type="submit" class="boton boton-contorno boton-pequeno" {{deshabilitarSubir}}
                    aria-label="Subir grupo">↑</button>
        </form>
        <form method="post" action="{{ctx}}/app/docente/evaluacion" class="form-en-linea">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <input type="hidden" name="id" value="{{id}}">
            <input type="hidden" name="accion" value="bajarGrupo">
            <input type="hidden" name="nivel" value="{{nivel}}">
            <input type="hidden" name="competencia" value="{{competencia}}">
            <input type="hidden" name="dificultad" value="{{dificultad}}">
            <button type="submit" class="boton boton-contorno boton-pequeno" {{deshabilitarBajar}}
                    aria-label="Bajar grupo">↓</button>
        </form>
        <form method="post" action="{{ctx}}/app/docente/evaluacion" class="form-en-linea">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <input type="hidden" name="id" value="{{id}}">
            <input type="hidden" name="accion" value="puntajeGrupo">
            <input type="hidden" name="nivel" value="{{nivel}}">
            <input type="hidden" name="competencia" value="{{competencia}}">
            <input type="hidden" name="dificultad" value="{{dificultad}}">
            <input type="number" name="puntaje" step="0.5" min="0" max="1000" value="{{puntaje}}"
                   class="entrada-puntaje" aria-label="Puntaje del grupo">
            <button type="submit" class="boton boton-contorno boton-pequeno">Guardar puntaje</button>
        </form>
    </td>
</tr>
