<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{tituloCurso}} | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tabla.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/insignia.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/docente-curso.css">
</head>
<body>
{{{nav}}}
<main class="contenido">
    <nav class="migas" aria-label="Ruta">
        <a href="{{ctx}}/app/docente/cursos">Mis cursos</a>
        <span aria-hidden="true">/</span>
        <span>{{tituloCurso}}</span>
    </nav>
    {{{mensajes}}}
    <header class="encabezado">
        <div>
            <h1>{{tituloCurso}}</h1>
            <p class="meta">Nivel {{nivel}} <span class="insignia {{claseEstado}}">{{estado}}</span></p>
        </div>
        <div class="acciones">{{{accionEstado}}}</div>
    </header>

    <div class="disposicion">
        <section class="hoja">
            <h2>Grupos</h2>
            <div class="tabla-contenedor">
                <table class="tabla">
                    <thead>
                    <tr><th scope="col">Grupo</th><th scope="col">Periodo</th><th scope="col">Estudiantes</th><th scope="col">Estado</th></tr>
                    </thead>
                    <tbody>{{{filasGrupos}}}</tbody>
                </table>
            </div>
        </section>

        <div class="columna">
            <section class="hoja">
                <h2>Abrir grupo</h2>
                {{{formGrupo}}}
            </section>
            <section class="hoja">
                <h2>Datos del curso</h2>
                <form method="post" action="{{ctx}}/app/docente/curso" class="formulario">
                    <input type="hidden" name="_csrf" value="{{csrf}}">
                    <input type="hidden" name="id" value="{{id}}">
                    <input type="hidden" name="accion" value="actualizar">
                    <div class="campo">
                        <label for="nombre">Nombre del curso</label>
                        <input id="nombre" name="nombre" type="text" required minlength="3" maxlength="100" value="{{nombre}}">
                    </div>
                    <div class="campo">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" maxlength="500" rows="3">{{descripcion}}</textarea>
                    </div>
                    <p class="ayuda">El nivel no se cambia: los grupos y sus resultados dependen de él.</p>
                    <button type="submit" class="boton boton-contorno">Guardar cambios</button>
                </form>
            </section>
        </div>
    </div>
</main>
</body>
</html>
