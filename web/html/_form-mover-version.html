<form method="post" action="{{destino}}" class="form-en-linea">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="accion" value="moverPreguntaVersion">
    <input type="hidden" name="idVersion" value="{{idVersion}}">
    <input type="hidden" name="idVersionPregunta" value="{{idVersionPregunta}}">
    <input type="hidden" name="direccion" value="{{direccion}}">
    <button type="submit" class="boton boton-contorno boton-pequeno" {{deshabilitar}}
            aria-label="{{aria}}">{{flecha}}</button>
</form>
