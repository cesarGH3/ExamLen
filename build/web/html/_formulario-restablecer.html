<form method="post" action="{{ctx}}/restablecer" class="formulario">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="token" value="{{token}}">
    <div class="campo">
        <label for="nueva">Nueva contraseña</label>
        <input id="nueva" name="nueva" type="password" required
               minlength="8" maxlength="128"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,128}"
               title="Mínimo 8 caracteres con mayúscula, minúscula, número y carácter especial"
               autocomplete="new-password" aria-describedby="ayuda-nueva">
        <p id="ayuda-nueva" class="ayuda">Mínimo 8 caracteres, con una mayúscula, una minúscula, un número y un carácter especial.</p>
    </div>
    <div class="campo">
        <label for="confirmacion">Confirmar nueva contraseña</label>
        <input id="confirmacion" name="confirmacion" type="password" required
               minlength="8" maxlength="128" autocomplete="new-password">
    </div>
    <button type="submit" class="boton boton-bloque">Guardar contraseña</button>
</form>
