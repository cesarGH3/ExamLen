<h2>Enunciado y clasificación</h2>
<form method="post" action="{{ctx}}/app/docente/pregunta" class="formulario">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="accion" value="actualizar">
    <div class="campo">
        <label for="enunciado">Enunciado</label>
        <textarea id="enunciado" name="enunciado" required minlength="5" rows="6">{{enunciado}}</textarea>
    </div>
    <div class="campos-fila campos-tres">
        <div class="campo">
            <label for="nivel">Nivel</label>
            <select id="nivel" name="nivel" required>{{{opcionesNivel}}}</select>
        </div>
        <div class="campo">
            <label for="dificultad">Dificultad</label>
            <select id="dificultad" name="dificultad" required>{{{opcionesDificultad}}}</select>
        </div>
        <div class="campo">
            <label for="competencia">Competencia</label>
            <select id="competencia" name="competencia" required>{{{opcionesCompetencia}}}</select>
        </div>
    </div>
    <div class="campo">
        <label for="tema">Tema</label>
        <input id="tema" name="tema" type="text" required minlength="2" maxlength="100" value="{{tema}}">
    </div>
    {{{avisoAprobada}}}
    <div class="acciones">
        <button type="submit" class="boton">Guardar cambios</button>
    </div>
</form>
