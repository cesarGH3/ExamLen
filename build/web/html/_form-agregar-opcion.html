<form method="post" action="{{destino}}" class="formulario formulario-opcion">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="accion" value="agregarOpcion">
    <div class="campo">
        <label for="texto">Nueva opción</label>
        <input id="texto" name="texto" type="text" required maxlength="500" value="{{textoOpcion}}">
    </div>
    <label class="casilla">
        <input type="checkbox" name="esCorrecta" value="true">
        Es la respuesta correcta
    </label>
    <div class="acciones">
        <button type="submit" class="boton boton-contorno">Agregar opción</button>
    </div>
</form>
