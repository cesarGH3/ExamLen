<section class="hoja">
<h2>{{tituloNuevaPregunta}}</h2>
<p class="ayuda">{{ayudaNuevaPregunta}}</p>
                <form method="post" action="{{destino}}" class="formulario">
                    <input type="hidden" name="_csrf" value="{{csrf}}">
                    <input type="hidden" name="id" value="{{id}}">
                    <input type="hidden" name="accion" value="crearPregunta">
                    <div class="campo">
                        <label for="tipo">Tipo</label>
                        <select id="tipo" name="tipo" required>{{{opcionesTipo}}}</select>
                    </div>
                    <div class="campo">
                        <label for="enunciado">Enunciado</label>
                        <textarea id="enunciado" name="enunciado" required minlength="5" rows="5">{{enunciado}}</textarea>
                    </div>
                    <div class="campos-fila">
                        <div class="campo">
                            <label for="nivel">Nivel</label>
                            <select id="nivel" name="nivel" required>{{{opcionesNivel}}}</select>
                        </div>
                        <div class="campo">
                            <label for="dificultad">Dificultad</label>
                            <select id="dificultad" name="dificultad" required>{{{opcionesDificultad}}}</select>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="competencia">Competencia</label>
                        <select id="competencia" name="competencia" required>{{{opcionesCompetencia}}}</select>
                    </div>
                    <div class="campo">
                        <label for="tema">Tema</label>
                        <input id="tema" name="tema" type="text" required minlength="2" maxlength="120" value="{{tema}}"
                               aria-describedby="ayuda-tema">
                        <p id="ayuda-tema" class="ayuda">Por ejemplo: Past Simple, Travel Vocabulary.</p>
                    </div>
                    <p class="ayuda">Después de crearla agregas las opciones o la respuesta esperada. Puedes
                        guardarla incompleta como borrador; quedará aprobada automáticamente cuando sea válida.</p>
                    <button type="submit" class="boton">Crear pregunta</button>
                </form>
</section>
