<h2>{{titulo}}</h2>
<form method="post" action="{{ctx}}/app/docente/pregunta" class="formulario">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="accion" value="respuestaEsperada">
    <div class="campo">
        <label for="respuestaEsperada">{{etiqueta}}</label>
        <textarea id="respuestaEsperada" name="respuestaEsperada" maxlength="500" rows="3"
                  aria-describedby="ayuda-respuesta">{{respuesta}}</textarea>
        <p id="ayuda-respuesta" class="ayuda">{{ayuda}}</p>
    </div>
    <div class="acciones">
        <button type="submit" class="boton">Guardar</button>
    </div>
</form>
