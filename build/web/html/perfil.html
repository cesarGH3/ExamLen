<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/perfil.css">
</head>
<body>
{{{nav}}}
<main class="contenido contenido-estrecho">
    {{{mensajes}}}
    <section class="hoja">
        <h1>Mi perfil</h1>
        <dl class="datos-fijos">
            <div>
                <dt>Identificación</dt>
                <dd>{{identificacion}}</dd>
            </div>
            <div>
                <dt>Tipo de cuenta</dt>
                <dd>{{tipo}}</dd>
            </div>
        </dl>
        <form method="post" action="{{ctx}}/app/perfil" class="formulario">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" required
                       minlength="2" maxlength="100" pattern="[\p{L}][\p{L} '\-]{1,99}"
                       title="Solo letras, espacios, apóstrofos o guiones"
                       autocomplete="name" value="{{nombre}}">
            </div>
            <div class="campo">
                <label for="correo">Correo</label>
                <input id="correo" name="correo" type="email" required maxlength="254"
                       autocomplete="email" value="{{correo}}">
            </div>
            <div class="acciones">
                <button type="submit" class="boton">Guardar cambios</button>
                <a href="{{ctx}}/app/perfil/contrasena">Cambiar contraseña</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
