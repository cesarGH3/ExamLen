<tr>
    <td>{{nivelTexto}} · {{competenciaTexto}} · {{dificultadTexto}}</td>
    <td>{{tema}}</td>
    <td class="texto-largo">{{enunciado}}</td>
    <td class="celda-accion">
        <form method="post" action="{{ctx}}/app/docente/evaluacion" class="form-en-linea">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <input type="hidden" name="id" value="{{id}}">
            <input type="hidden" name="accion" value="seleccionarPregunta">
            <input type="hidden" name="idPregunta" value="{{idPregunta}}">
            <button type="submit" class="boton boton-contorno boton-pequeno">Seleccionar</button>
        </form>
    </td>
</tr>
