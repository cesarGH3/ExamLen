<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiantes | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tabla.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/insignia.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/admin-estudiantes.css">
</head>
<body>
{{{nav}}}
<main class="contenido">
    {{{mensajes}}}
    <h1>Estudiantes</h1>

    <section class="hoja">
        <h2>Buscar estudiantes</h2>
        <form method="get" action="{{ctx}}/app/admin/estudiantes" class="formulario formulario-fila">
            <div class="campo">
                <label for="buscar">Nombre, identificación o correo</label>
                <input id="buscar" name="buscar" type="search" maxlength="100"
                       autocomplete="off" value="{{buscar}}">
            </div>
            <div class="acciones">
                <button type="submit" class="boton">Buscar</button>
                <a class="boton boton-contorno" href="{{ctx}}/app/admin/estudiantes">Limpiar</a>
            </div>
        </form>
        <p class="ayuda">El listado muestra hasta 100 resultados. Con el buscador vacío se ven todos.</p>
    </section>

    <section class="hoja">
        <h2>Estudiantes registrados</h2>
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col">Identificación</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Correo</th>
                    <th scope="col">Nivel de inglés</th>
                    <th scope="col">Estado</th>
                    <th scope="col"><span class="oculto">Acciones</span></th>
                </tr>
                </thead>
                <tbody>
                {{{filas}}}
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
