<h2>Enunciado, respuesta y puntaje</h2>
<div class="lectura">
    <div class="campo">
        <p class="etiqueta-lectura">Enunciado</p>
        <p class="valor-lectura texto-largo">{{enunciado}}</p>
    </div>
    <div class="campo">
        <p class="etiqueta-lectura">{{etiquetaRespuesta}}</p>
        <p class="valor-lectura texto-largo">{{respuestaEsperada}}</p>
    </div>
    <div class="campo">
        <p class="etiqueta-lectura">Puntaje en esta versión</p>
        <p class="valor-lectura">{{puntaje}}</p>
    </div>
</div>
