<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/cambiar-contrasena.css">
</head>
<body>
{{{nav}}}
<main class="contenido contenido-estrecho">
    {{{aviso}}}
    {{{mensajes}}}
    <section class="hoja">
        <h1>Cambiar contraseña</h1>
        <form method="post" action="{{ctx}}/app/perfil/contrasena" class="formulario">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <div class="campo">
                <label for="actual">Contraseña actual</label>
                <input id="actual" name="actual" type="password" required maxlength="128"
                       autocomplete="current-password">
            </div>
            <div class="campo">
                <label for="nueva">Nueva contraseña</label>
                <input id="nueva" name="nueva" type="password" required
                       minlength="8" maxlength="128"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,128}"
                       title="Mínimo 8 caracteres con mayúscula, minúscula, número y carácter especial"
                       autocomplete="new-password" aria-describedby="ayuda-nueva">
                <p id="ayuda-nueva" class="ayuda">Mínimo 8 caracteres, con una mayúscula, una minúscula, un número y un carácter especial.</p>
            </div>
            <div class="campo">
                <label for="confirmacion">Confirmar nueva contraseña</label>
                <input id="confirmacion" name="confirmacion" type="password" required
                       minlength="8" maxlength="128" autocomplete="new-password">
            </div>
            <div class="acciones">
                <button type="submit" class="boton">Guardar contraseña</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
