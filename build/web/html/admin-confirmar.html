<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar acción | ExamLen</title>
    <link rel="stylesheet" href="{{ctx}}/css/base.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/navegacion.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/tarjeta.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/formulario.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/boton.css">
    <link rel="stylesheet" href="{{ctx}}/css/componentes/alerta.css">
    <link rel="stylesheet" href="{{ctx}}/css/paginas/admin-confirmar.css">
</head>
<body>
{{{nav}}}
<main class="contenido contenido-estrecho">
    {{{mensajes}}}
    <section class="hoja">
        <h1>{{titulo}}</h1>
        <p>{{mensaje}}</p>
        {{{aviso}}}
        <form method="post" action="{{destino}}" class="formulario">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <input type="hidden" name="accion" value="{{accion}}">
            <input type="hidden" name="id" value="{{id}}">
            <input type="hidden" name="confirmado" value="1">
            <div class="acciones">
                <button type="submit" class="boton {{claseBoton}}">{{textoConfirmar}}</button>
                <a class="boton boton-contorno" href="{{volver}}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
