<form method="post" action="{{ctx}}/app/docente/curso" class="formulario">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="accion" value="abrirGrupo">
    <div class="campo">
        <label for="grupoNombre">Nombre del grupo</label>
        <input id="grupoNombre" name="grupoNombre" type="text" required maxlength="50"
               pattern="[\p{L}\p{N}][\p{L}\p{N} \-]{0,49}"
               title="Letras, números, espacios o guiones" value="{{grupoNombre}}" aria-describedby="ayuda-grupo">
        <p id="ayuda-grupo" class="ayuda">Por ejemplo: Grupo A, Mañana, Sábados.</p>
    </div>
    <div class="campo">
        <label for="grupoPeriodo">Periodo</label>
        <input id="grupoPeriodo" name="grupoPeriodo" type="text" required maxlength="6"
               pattern="\d{4}-[1-4]" title="Año y número de periodo, por ejemplo 2027-1"
               value="{{grupoPeriodo}}" aria-describedby="ayuda-periodo">
        <p id="ayuda-periodo" class="ayuda">Año y número de periodo, por ejemplo 2027-1.</p>
    </div>
    <button type="submit" class="boton">Abrir grupo</button>
</form>
